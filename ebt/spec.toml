# ebt/spec.toml — реестр требований и инвариантов проекта (EBT, уровень решения).
#
# Это спецификация, а не код. Её пишет аналитик из тикета, решений владельца и эталона
# до кода, а утверждает человек (решение D4). Агент, который пишет код приложения, этот
# файл не меняет. Заготовка ниже — пример для замены: идентификаторы EXAMPLE и правило
# `example_rule` не должны попасть в утверждённую спецификацию продукта.
#
# [req.<ID>] — требование:
#   text   — что должно быть верно, словами предметной области;
#   source — откуда взято: ticket, decision <дата>, <эталон>: path:line.
#
# [inv.<ID>] — проверяемая формулировка требования:
#   req        — какой REQ формализует инвариант;
#   statement  — одна фраза для человека;
#   checker    — имя в CHECKERS из ebt/checks.py или чекер ядра
#                (cart_total, transition, sync_merge);
#   witness    — поля data, без которых результат нельзя пересчитать;
#   partitions — классы входов, каждый из которых обязан встретиться в прогоне.
#
# Для машины состояний вместо partitions задайте checker = "transition" и
# transitions = [[from, event, to], ...]; классы покрытия выводятся по одному на переход.
#
# Для требования с видимым или сохраняемым исходом добавьте близнеца <INV>-OBS с тем же
# checker и witness, но своими partitions: его записи делает тест по наблюдению (D29).
#
# Правило проверяется независимо: checks.py не импортирует приложение и SDK и не смотрит
# на поле ok. Стоимость поддержки спецификации ниже, если witness — минимальный набор
# входов и выходов, а partitions — реальные границы из требования, а не перечень тестов.

[meta]
version = "2026-11-01"  # демонстрационная spec; не требование продукта

# ── Пример: замените на утверждённое требование ───────────────────────

[req.REQ-EXAMPLE-1]
text = """Итог равен удвоенному значению: result = value × 2. Это пример шаблона,
а не требование продукта: замените текст, ID и source утверждённым требованием."""
source = """ticket: <номер и цитата>; decision <дата>: <цитата>"""

[inv.INV-EXAMPLE-1]
req = "REQ-EXAMPLE-1"
statement = "result == value × 2"
checker = "example_rule"
witness = ["value", "result"]
# Классы входов, которые обязаны встретиться в свидетельствах. Нарушение правила —
# не класс покрытия: его проверяет test_checks.py, а свидетельство с ним даёт находку.
partitions = ["zero", "positive", "negative"]

# ── Пример машины состояний (раскомментируйте и замените) ─────────────
#
# [req.REQ-CHECKOUT-1]
