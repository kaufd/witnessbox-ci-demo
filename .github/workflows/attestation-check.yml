name: attestation-check

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: "ID запуска ebt-verify с артефактом witnessbox-verdict"
        required: true

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать вердикт
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: witnessbox-verdict
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: verdict

      - name: Проверить аттестацию gate.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify verdict/gate.json \
            --repo kaufd/witnessbox-ci-demo \
            --signer-workflow kaufd/witnessbox-ci-demo/.github/workflows/ebt-verify.yml \
            --source-ref refs/heads/main
